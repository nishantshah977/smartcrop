[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcrop"
version = "0.3.0"
description = "Fast saliency + aesthetic-quality crop finder, tuned for social media"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
    "opencv-contrib-python-headless>=4.8,<5",
    "numpy>=1.24",
    "Pillow>=10.0",
]

[project.scripts]
smartcrop = "smartcrop.cli:main"

[tool.setuptools.packages.find]
include = ["smartcrop*"]
